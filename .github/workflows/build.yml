name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    environment: ci
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ShadowVM-CE
        run: |
          git lfs pull
          make ShadowVM-CE
